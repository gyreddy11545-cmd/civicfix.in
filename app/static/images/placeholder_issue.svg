<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#171A3A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgGrad)" rx="12" />
  <rect x="2" y="2" width="396" height="246" stroke="rgba(34, 211, 238, 0.25)" stroke-width="1.5" rx="10" />
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="50" x2="400" y2="50" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="0" y1="100" x2="400" y2="100" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="0" y1="150" x2="400" y2="150" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="0" y1="200" x2="400" y2="200" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="100" y1="0" x2="100" y2="250" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="200" y1="0" x2="200" y2="250" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="300" y1="0" x2="300" y2="250" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Center Pin & Camera Icon -->
  <circle cx="200" cy="100" r="44" fill="#0B1020" stroke="url(#accentGrad)" stroke-width="2.5" />
  
  <g transform="translate(180, 80)">
    <path d="M35 29a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3h5l3-4h8l3 4h5a3 3 0 0 1 3 3z" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="20" cy="21" r="6" stroke="#8B5CF6" stroke-width="2.2" fill="none" />
  </g>

  <!-- Labels -->
  <text x="200" y="170" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" fill="#F1F5F9" letter-spacing="0.5">
    CIVIC INFRASTRUCTURE REPORT
  </text>
  <text x="200" y="195" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="11" fill="#94A3B8">
    Photo Evidence On File • Verified Municipal Record
  </text>
</svg>
