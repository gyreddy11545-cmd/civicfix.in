<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- CivicFix Emblem (Pin + Road + Checkmark) -->
  <g transform="translate(10, 8)">
    <!-- Ambient Pin Glow Shadow -->
    <path d="M32 6 C17.6 6 6 17.6 6 32 C6 49 28 66 32 68 C36 66 58 49 58 32 C58 17.6 46.4 6 32 6 Z" 
          fill="#171A3A" stroke="url(#auroraGrad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Perspective Road Lines inside Pin -->
    <path d="M22 48 L27 22 L37 22 L42 48 Z" fill="#0B1020" stroke="#22D3EE" stroke-width="1.2" opacity="0.85"/>
    <line x1="32" y1="24" x2="32" y2="46" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- Luminous Emerald Civic Checkmark -->
    <circle cx="44" cy="46" r="12" fill="#0B1020" stroke="#34D399" stroke-width="2"/>
    <path d="M38 46 L42 50 L50 42" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(82, 42)">
    <text x="0" y="0" font-family="'Inter', 'Manrope', system-ui, sans-serif" font-weight="800" font-size="28" fill="#F1F5F9" letter-spacing="-0.5">
      Civic<tspan fill="url(#auroraGrad)">Fix</tspan>
    </text>
    <text x="2" y="18" font-family="'Inter', 'Manrope', system-ui, sans-serif" font-weight="600" font-size="10" fill="#94A3B8" letter-spacing="1.8">
      REPORT IT • TRACK IT • FIX IT
    </text>
  </g>
</svg>
