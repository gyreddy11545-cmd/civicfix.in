{% extends 'base.html' %}

{% block title %}Register — CivicFix Platform{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
  <div class="glass-card" style="border-top: 4px solid var(--accent-violet); padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="CivicFix" style="height: 48px; margin-bottom: 0.75rem;">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Citizen Registration</h2>
      <p style="font-size: 0.88rem; color: var(--text-muted);">Create your account to report civic issues and verify repairs</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Ramesh Kumar" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. ramesh@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Mobile Phone (for SMS / WhatsApp updates)</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 98765 43210">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Create Password (min. 6 characters)</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required minlength="6">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.85rem;">
        Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-cyan); font-weight: 600;">Sign In here</a>
    </div>
  </div>
</div>
{% endblock %}
